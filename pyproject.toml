[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evoctx"
version = "0.1.6"
description = "Local personal context store for AI coding assistants, exposed over MCP — by Evo Bytes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Evo Bytes SRL", email = "info@evobytes.ro" }]
keywords = ["mcp", "model-context-protocol", "ai", "memory", "context", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "mcp[cli]>=1.9,<2",
    "platformdirs>=4",
    "pyyaml>=6",
]

[project.optional-dependencies]
# pytest-cov is not needed to run the suite. `scripts/preflight.py` uses it to
# answer "was the failure path I just added ever executed", and degrades to a
# REVIEW line naming this install command when it is absent — so it stays a
# dev extra rather than a hard dependency.
dev = ["pytest>=8", "pytest-cov>=5"]

[project.urls]
Homepage = "https://evobytes.ro"
# The wheel ships code only, so every docs/ path the CLI and README mention is
# absent for `pip install evoctx`. These are how those readers reach the files.
Repository = "https://github.com/evobytesRo/evoctx"
Changelog = "https://github.com/evobytesRo/evoctx/blob/main/CHANGELOG.md"
Issues = "https://github.com/evobytesRo/evoctx/issues"

[project.scripts]
evoctx = "evoctx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evoctx"]

# Pinned so `pyright` reproduces the same result for everyone, rather than
# depending on which interpreter and flags each person happens to pass.
# pythonVersion is the floor from requires-python: type-checking against 3.10
# is what stops 3.11+-only syntax reaching a supported runtime.
[tool.pyright]
include = ["src", "tests", "scripts"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
typeCheckingMode = "standard"

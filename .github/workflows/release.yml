name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # The release does NOT re-run the suite: CI already ran it on `main` across
  # 3 OS x 2 Python plus pyright, and a single-platform re-run here would be
  # strictly weaker while reading as though it were the gate. What it checks
  # instead is the one thing CI cannot — that this tag is on a commit `main`
  # actually contains, i.e. the commit that was tested. A PyPI version can
  # never be reused, so tagging a branch, a revert, or a local-only commit is
  # the mistake worth making impossible rather than merely unlikely.
  verify-tagged-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # ancestry needs real history, not a shallow clone
      - name: Refuse a tag that is not on main
        run: |
          # plain fetch: `--depth=0` is rejected outright ("depth 0 is not a
          # positive number"), and `fetch-depth: 0` above already gave us the
          # full history — this only needs the main ref present
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not an ancestor of origin/main."
            echo "CI runs on main; this commit was never tested there."
            echo "Push to main, wait for CI green, then tag that commit."
            exit 1
          fi
          echo "$GITHUB_SHA is on main — CI covered it."

  build:
    needs: verify-tagged-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # required for PyPI trusted publishing (OIDC) — no API token stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the GitHub release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

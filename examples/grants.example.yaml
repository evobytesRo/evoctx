# Example grants.yaml — copy what you need into YOUR grants.yaml.
#
# Where is my grants.yaml?  Next to the store database. Run `evoctx doctor`
# — the "store dir" line is the folder. Typical locations:
#   Windows:  %LOCALAPPDATA%\evoctx\grants.yaml
#   macOS:    ~/Library/Application Support/evoctx/grants.yaml
#   Linux:    ~/.local/share/evoctx/grants.yaml
#   (or ~/.context/grants.yaml on pre-1.0 installs, or $CONTEXT_STORE if set)
#
# Edits are hot-reloaded — no server restart. Exactly ONE grant is active at
# a time; switch with:  evoctx grant activate <name>
#
# Every grant needs `expires`. Relative values (+30d, +8h, +45m) count from
# the moment you activate the grant, absolute values are ISO timestamps.

grants:
  # ── The default: everything, time-boxed ─────────────────────────────────
  # This is what a fresh install auto-creates and activates. Re-activate it
  # when it expires:  evoctx grant activate everything
  - name: everything
    client: "*"
    tools: [list_projects, get_project, search_context, get_by_id,
            write_note, start_session, end_session, recent_sessions,
            list_grants]
    scope:
      projects: ["*"]
      exclude_tags: []
    redactions: []
    expires: "+30d"

  # ── Daily coding: everything except private notes ───────────────────────
  # Same tools, but notes tagged #personal or #finance are invisible, and
  # anything matching the redaction patterns is masked before the AI sees it.
  - name: daily-coding
    client: "*"
    tools: [list_projects, get_project, search_context, get_by_id,
            write_note, start_session, end_session, recent_sessions,
            list_grants]
    scope:
      projects: ["*"]
      exclude_tags: ["#personal", "#finance"]
    redactions:
      - pattern: "sk-[A-Za-z0-9]{20,}"          # OpenAI-style API keys
        replace: "[API_KEY]"
      - pattern: "(?i)password\\s*[:=]\\s*\\S+"  # password: hunter2
        replace: "[PASSWORD]"
    expires: "+7d"

  # ── One project, read-only, short leash ──────────────────────────────────
  # For pointing a less-trusted client at a single project. No write_note,
  # no sessions — it can look things up and nothing else.
  - name: payments-readonly
    client: "cursor"                # only a client calling itself "cursor"
    tools: [list_projects, get_project, search_context, get_by_id, list_grants]
    scope:
      projects: ["payments", "payments-*"]      # globs allowed
      exclude_tags: ["#personal"]
    redactions:
      - pattern: "acme-\\w+"                    # client codenames
        replace: "[CLIENT]"
    expires: "+4h"
